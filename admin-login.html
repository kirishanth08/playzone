<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<meta name="description" content="KidNest administrator login portal">
<title>Admin Login | KidNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
.auth-top-actions{position:fixed;top:20px;right:24px;z-index:1000;display:flex;gap:8px}.auth-top-actions button{width:42px;height:42px;border:1px solid var(--border-color);border-radius:12px;background:var(--bg-card);color:var(--text-primary);display:grid;place-items:center;box-shadow:var(--shadow-sm)}.auth-top-actions .rtl-toggle-btn{font-size:.72rem;font-weight:900}.auth-page{min-height:100vh;background:var(--bg-secondary);padding:30px 0;display:flex;align-items:center;justify-content:center}
.auth-wrap{width:100%;max-width:520px;margin:auto;padding:30px 15px}.auth-shell{background:var(--bg-card);border:1px solid var(--border-color);border-radius:28px;overflow:hidden;box-shadow:var(--shadow-xl);padding:46px 42px}
.auth-inner{width:100%;margin:auto}.auth-header{text-align:center;margin-bottom:26px}.auth-logo{display:inline-flex;justify-content:center;align-items:center;margin:0 auto 14px auto}.auth-logo img{height:46px;margin:0 auto}h2{font-family:var(--font-heading);font-size:2.35rem;color:var(--text-primary);margin-bottom:8px;text-align:center}.sub{color:var(--text-secondary);margin-bottom:26px;text-align:center}.label{color:var(--text-primary);font-weight:800;font-size:.9rem;margin-bottom:8px}.input-wrap{position:relative}.input-wrap>i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);z-index:2}.input{width:100%;height:52px;border:1px solid var(--border-color);border-radius:12px;background:var(--bg-primary);color:var(--text-primary);padding:0 46px 0 44px;outline:none}.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light)}.toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--text-muted);padding:5px}.submit{width:100%;height:54px;border:0;border-radius:50px;background:var(--gradient-primary);color:#fff;font-weight:700;font-size:1rem;box-shadow:0 4px 15px rgba(255,107,53,.35);cursor:pointer;transition:var(--transition-normal)}.submit:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,107,53,.45)}.links{text-align:center;color:var(--text-secondary);font-size:.92rem;margin-top:22px}.links a{color:var(--primary);font-weight:900;text-decoration:none}.alertx{display:none;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:.88rem;font-weight:700;text-align:center}.alertx.show{display:block;background:rgba(34,197,94,.12);color:#15803d;border:1px solid rgba(34,197,94,.25)}[data-theme=dark] .alertx.show{color:#86efac}
@media(max-width:575.98px){.auth-top-actions{top:12px;right:12px}.auth-page{padding:18px 0}.auth-shell{padding:32px 20px;border-radius:22px}h2{font-size:2rem}}
[dir=rtl] .input{padding-right:44px;padding-left:46px}[dir=rtl] .input-wrap>i{left:auto;right:16px}[dir=rtl] .toggle{right:auto;left:14px}
</style>
</head>
<body>
<div class="preloader"><div class="preloader-spinner"></div></div>
<div class="auth-top-actions"><button class="rtl-toggle-btn" title="Toggle RTL/LTR"><span>RTL</span></button><button class="theme-toggle-btn" title="Toggle Dark/Light"><i class="fas fa-moon"></i></button></div>
<main class="auth-page">
  <div class="container auth-wrap">
    <div class="auth-shell">
      <div class="auth-inner">
        <div class="auth-header mb-4 text-center">
          <a href="index.html" class="auth-logo">
            <img class="brand-logo-light" src="images/logo.svg" alt="KidNest">
            <img class="brand-logo-dark" src="images/logo-dark.svg" alt="KidNest" style="display:none">
          </a>
          <h2 class="mt-2 mb-1">Welcome, Admin</h2>
          <p class="sub mb-0">Sign in to access the KidNest management dashboard.</p>
        </div>
        <div id="alert" class="alertx"></div>
        <form id="form" novalidate>
          <div class="mb-3">
            <label class="label" for="email">Admin email</label>
            <div class="input-wrap">
              <i class="fas fa-envelope"></i>
              <input class="input" id="email" type="email" placeholder="admin@kidnest.com" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="label" for="password">Password</label>
            <div class="input-wrap">
              <i class="fas fa-lock"></i>
              <input class="input" id="password" type="password" placeholder="Enter your password" minlength="6" required>
              <button type="button" class="toggle" id="toggle"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-4">
            <label class="text-secondary small"><input type="checkbox" class="me-2" id="remember">Remember me</label>
            <a href="#" id="forgot" class="small" style="color:var(--primary);text-decoration:none;font-weight:800">Forgot password?</a>
          </div>
          <button class="submit" type="submit"><i class="fas fa-right-to-bracket me-2"></i>Sign In to Admin Portal</button>
        </form>
        <div class="links">Need an admin account? <a href="admin-register.html">Create one</a><br><span class="small">Member?</span> <a href="login.html">Go to Member Login</a></div>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const f=document.getElementById('form'),p=document.getElementById('password'),a=document.getElementById('alert');
  document.getElementById('toggle').onclick=()=>{p.type=p.type==='password'?'text':'password'};
  document.getElementById('forgot').onclick=e=>{e.preventDefault();alert('Password reset is a demo interaction. Connect this action to your backend later.')};
  f.onsubmit=e=>{
    e.preventDefault();
    if(!f.checkValidity()){f.classList.add('was-validated');return}
    a.textContent='Admin login successful!';
    a.className='alertx show';
    localStorage.setItem('kpz-admin-email',document.getElementById('email').value);
  };
});
</script>
</body>
</html>
