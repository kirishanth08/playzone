<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="images/logo.svg">
<meta name="description" content="Create your KidNest account."><title>Create Account | KidNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet">
<style>
.auth-page{min-height:100vh;background:var(--bg-secondary);padding:30px 0;display:flex;align-items:center;justify-content:center}.auth-top-actions{position:fixed;top:20px;right:24px;z-index:1000;display:flex;gap:8px}.auth-top-actions button{width:42px;height:42px;border:1px solid var(--border-color);border-radius:12px;background:var(--bg-card);color:var(--text-primary);display:grid;place-items:center;box-shadow:var(--shadow-sm)}.auth-top-actions .rtl-toggle-btn{font-size:.72rem;font-weight:900}
.auth-wrap{width:100%;max-width:560px;margin:auto;padding:30px 15px}.auth-shell{background:var(--bg-card);border:1px solid var(--border-color);border-radius:28px;overflow:hidden;box-shadow:var(--shadow-xl);padding:46px 42px}
.auth-form-inner{width:100%;margin:auto}.auth-header{text-align:center;margin-bottom:26px}.auth-logo{display:inline-flex;justify-content:center;align-items:center;margin:0 auto 14px auto}.auth-logo img{height:46px;width:auto;margin:0 auto}h2{font-family:var(--font-heading);font-size:2.35rem;color:var(--text-primary);margin-bottom:8px;text-align:center}.subtitle{color:var(--text-secondary);margin-bottom:24px;text-align:center}.form-label{color:var(--text-primary);font-weight:800;font-size:.9rem;margin-bottom:7px}.input-wrap{position:relative}.input-wrap>i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text-muted);z-index:2}.auth-input{width:100%;height:50px;border:1px solid var(--border-color);border-radius:12px;background:var(--bg-primary);color:var(--text-primary);padding:0 44px;outline:none}.auth-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light)}.auth-input::placeholder{color:var(--text-muted)}.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--text-muted)}.terms{font-size:.84rem;color:var(--text-secondary);line-height:1.55}.terms a,.switch a{color:var(--primary);font-weight:800;text-decoration:none}.submit{width:100%;height:52px;border:0;border-radius:50px;background:var(--gradient-primary);color:#fff;font-weight:600;font-size:1rem;box-shadow:0 4px 15px rgba(255,107,53,.35);transition:var(--transition-normal);cursor:pointer}.submit:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,107,53,.45)}.switch{text-align:center;color:var(--text-secondary);font-size:.92rem;margin-top:20px}.alert-box{display:none;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:.88rem;font-weight:700;text-align:center}.alert-box.show{display:block}.alert-box.success{background:rgba(34,197,94,.12);color:#15803d;border:1px solid rgba(34,197,94,.25)}[data-theme="dark"] .alert-box.success{color:#86efac}
[dir="rtl"] .input-wrap>i{left:auto;right:15px}[dir="rtl"] .auth-input{padding-left:44px;padding-right:44px}[dir="rtl"] .password-toggle{right:auto;left:12px}
@media(max-width:575.98px){.auth-top-actions{top:12px;right:12px}.auth-page{padding:18px 0}.auth-shell{padding:32px 20px;border-radius:22px}h2{font-size:2rem}}
</style></head><body>
<div class="preloader"><div class="preloader-spinner"></div></div>
<div class="auth-top-actions"><button class="rtl-toggle-btn" title="Toggle RTL/LTR"><span>RTL</span></button><button class="theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button></div>
<main class="auth-page">
  <div class="container auth-wrap">
    <div class="auth-shell">
      <div class="auth-form-inner">
        <div class="auth-header mb-4 text-center">
          <a href="index.html" class="auth-logo">
            <img class="brand-logo-light" src="images/logo.svg" alt="KidNest">
            <img class="brand-logo-dark" src="images/logo-dark.svg" alt="KidNest" style="display:none">
          </a>
          <h2 class="mt-2 mb-1">Create your account</h2>
          <p class="subtitle mb-0">Set up your KidNest profile in a few simple steps.</p>
        </div>
        <div id="registerAlert" class="alert-box success" role="status"></div>
        <form id="registerForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="firstName">First name</label>
              <div class="input-wrap"><i class="fas fa-user"></i><input class="auth-input" id="firstName" required placeholder="Your first name"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="lastName">Last name</label>
              <div class="input-wrap"><i class="fas fa-user"></i><input class="auth-input" id="lastName" required placeholder="Your last name"></div>
            </div>
            <div class="col-12">
              <label class="form-label" for="email">Email address</label>
              <div class="input-wrap"><i class="fas fa-envelope"></i><input class="auth-input" id="email" type="email" required placeholder="name@example.com" autocomplete="email"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="password">Password</label>
              <div class="input-wrap"><i class="fas fa-lock"></i><input class="auth-input" id="password" type="password" minlength="6" required placeholder="At least 6 characters"><button class="password-toggle" type="button" data-target="password"><i class="fas fa-eye"></i></button></div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="confirmPassword">Confirm password</label>
              <div class="input-wrap"><i class="fas fa-lock"></i><input class="auth-input" id="confirmPassword" type="password" minlength="6" required placeholder="Repeat password"><button class="password-toggle" type="button" data-target="confirmPassword"><i class="fas fa-eye"></i></button></div>
            </div>
          </div>
          <label class="d-flex gap-2 align-items-start mt-4 terms"><input type="checkbox" id="terms" required style="margin-top:3px;accent-color:var(--primary)"><span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span></label>
          <button class="submit mt-4" type="submit"><i class="fas fa-user-plus me-2"></i>Create Account</button>
        </form>
        <div class="switch">Already have an account? <a href="login.html">Sign in</a></div>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('.password-toggle').forEach(btn=>btn.addEventListener('click',()=>{
    const input=document.getElementById(btn.dataset.target);
    const show=input.type==='password';
    input.type=show?'text':'password';
    btn.innerHTML=show?'<i class="fas fa-eye-slash"></i>':'<i class="fas fa-eye"></i>';
  }));
  const form=document.getElementById('registerForm'),alertBox=document.getElementById('registerAlert');
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const p=document.getElementById('password'),c=document.getElementById('confirmPassword');
    if(!form.checkValidity()||p.value!==c.value){
      form.classList.add('was-validated');
      if(p.value!==c.value)c.setCustomValidity('Passwords do not match');
      else c.setCustomValidity('');
      return;
    }
    c.setCustomValidity('');
    const email=document.getElementById('email').value;
    const fn=document.getElementById('firstName').value;
    const ln=document.getElementById('lastName').value;
    localStorage.setItem('kpz-user-email',email);
    localStorage.setItem('kpz-parent-email',email);
    localStorage.setItem('kpz-user-name',`${fn} ${ln}`.trim());
    localStorage.setItem('kpz-user-auth','true');
    localStorage.setItem('kpz-parent-auth','true');
    alertBox.textContent='Account created successfully!';
    alertBox.className='alert-box success show';
  });
});
</script>
</body></html>
