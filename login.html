<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="images/logo.svg">
<meta name="description" content="Login to KidNest indoor play area. Access your bookings, memberships and visit history.">
<title>Login | KidNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
.auth-top-actions{position:fixed;top:20px;right:24px;z-index:1000;display:flex;gap:8px}.auth-top-actions button{width:42px;height:42px;border:1px solid var(--border-color);border-radius:12px;background:var(--bg-card);color:var(--text-primary);display:grid;place-items:center;box-shadow:var(--shadow-sm)}.auth-top-actions .rtl-toggle-btn{font-size:.72rem;font-weight:900}.auth-page{min-height:100vh;background:var(--bg-secondary);padding:30px 0;display:flex;align-items:center;justify-content:center}
.auth-wrap{width:100%;max-width:520px;margin:auto;padding:30px 15px}
.auth-shell{background:var(--bg-card);border:1px solid var(--border-color);border-radius:28px;overflow:hidden;box-shadow:var(--shadow-xl);padding:46px 42px}
.auth-form-inner{width:100%;margin:auto}.auth-header{text-align:center;margin-bottom:26px}.auth-logo{display:inline-flex;justify-content:center;align-items:center;margin:0 auto 14px auto}.auth-logo img{height:46px;width:auto;margin:0 auto}h2{font-family:var(--font-heading);font-size:2.35rem;color:var(--text-primary);margin-bottom:8px;text-align:center}.auth-subtitle{color:var(--text-secondary);margin-bottom:26px;text-align:center}.auth-label{display:flex;justify-content:space-between;align-items:center;color:var(--text-primary);font-weight:800;font-size:.9rem;margin-bottom:8px}.auth-label a{font-size:.82rem;color:var(--primary);text-decoration:none}.auth-input-wrap{position:relative}.auth-input-wrap>i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);z-index:2}.auth-input{width:100%;height:52px;border:1px solid var(--border-color);border-radius:12px;background:var(--bg-primary);color:var(--text-primary);padding:0 46px 0 44px;outline:none;transition:var(--transition-normal)}.auth-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light)}.auth-input::placeholder{color:var(--text-muted)}.auth-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--text-muted);padding:5px}.auth-check{display:flex;align-items:center;gap:9px;color:var(--text-secondary);font-size:.9rem}.auth-check input{accent-color:var(--primary);width:16px;height:16px}.auth-submit{width:100%;height:52px;border:0;border-radius:50px;background:var(--gradient-primary);color:#fff;font-weight:600;font-size:1rem;box-shadow:0 4px 15px rgba(255,107,53,.35);transition:var(--transition-normal);cursor:pointer}.auth-submit:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,107,53,.45)}.auth-forgot-link{color:var(--primary);font-size:.88rem;font-weight:600;text-decoration:none}.auth-forgot-link:hover{color:var(--primary-hover);text-decoration:underline}.auth-divider{display:flex;align-items:center;gap:12px;color:var(--text-muted);font-size:.82rem;margin:22px 0}.auth-divider:before,.auth-divider:after{content:"";height:1px;background:var(--border-color);flex:1}.auth-social-group{display:flex;flex-direction:column;gap:11px;margin-bottom:22px}.auth-social-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:50px;border-radius:12px;font-weight:700;font-size:.92rem;cursor:pointer;transition:var(--transition-normal);text-decoration:none;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary)}.auth-social-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--primary);color:var(--text-primary)}.auth-social-apple{background:#000;color:#fff;border-color:#000}.auth-social-apple:hover{background:#1a1a1a;color:#fff;border-color:#1a1a1a;box-shadow:0 4px 15px rgba(0,0,0,.25)}[data-theme="dark"] .auth-social-apple{background:#fff;color:#000;border-color:#fff}[data-theme="dark"] .auth-social-apple:hover{background:#f0f0f0;color:#000;border-color:#f0f0f0;box-shadow:0 4px 15px rgba(255,255,255,.15)}[data-theme="dark"] .auth-social-btn:not(.auth-social-apple){background:var(--bg-primary);border-color:var(--border-color);color:var(--text-primary)}[data-theme="dark"] .auth-social-btn:not(.auth-social-apple):hover{border-color:rgba(255,255,255,.35);background:var(--bg-card)}.auth-register{text-align:center;color:var(--text-secondary);font-size:.92rem}.auth-register a{color:var(--primary);font-weight:900;text-decoration:none}.auth-alert{display:none;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:.88rem;font-weight:700;text-align:center}.auth-alert.show{display:block}.auth-alert.success{background:rgba(34,197,94,.12);color:#15803d;border:1px solid rgba(34,197,94,.25)}[data-theme="dark"] .auth-alert.success{color:#86efac}
@media(max-width:575.98px){.auth-top-actions{top:12px;right:12px}.auth-page{padding:18px 0}.auth-shell{padding:32px 20px;border-radius:22px}h2{font-size:2rem}}
[dir="rtl"] .auth-input{padding-right:44px;padding-left:46px}[dir="rtl"] .auth-input-wrap>i{left:auto;right:16px}[dir="rtl"] .auth-toggle{right:auto;left:14px}
</style>
</head>
<body>
<div class="preloader"><div class="preloader-spinner"></div></div>
<div class="auth-top-actions" aria-label="Display options"><button class="rtl-toggle-btn" title="Toggle RTL/LTR"><span>RTL</span></button><button class="theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button></div>
<main class="auth-page">
  <div class="container auth-wrap">
    <div class="auth-shell">
      <div class="auth-form-inner">
        <div class="auth-header mb-4 text-center">
          <a href="index.html" class="auth-logo">
            <img class="brand-logo-light" src="images/logo.svg" alt="KidNest">
            <img class="brand-logo-dark" src="images/logo-dark.svg" alt="KidNest" style="display:none">
          </a>
          <h2 class="mt-2 mb-1">Welcome back!</h2>
          <p class="auth-subtitle mb-0">Log in to continue managing your KidNest visits.</p>
        </div>
        <div id="loginAlert" class="auth-alert success" role="status"></div>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="auth-label" for="email">Email address</label>
            <div class="auth-input-wrap">
              <i class="fas fa-envelope"></i>
              <input class="auth-input" id="email" type="email" placeholder="name@example.com" autocomplete="email" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="auth-label" for="password"><span>Password</span></label>
            <div class="auth-input-wrap">
              <i class="fas fa-lock"></i>
              <input class="auth-input" id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
              <button class="auth-toggle" id="togglePassword" type="button" aria-label="Show password"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-4">
            <label class="auth-check"><input type="checkbox" id="remember"><span>Remember me</span></label>
            <a href="#" id="forgotPassword" class="auth-forgot-link">Forgot password?</a>
          </div>
          <button class="auth-submit" type="submit"><i class="fas fa-right-to-bracket me-2"></i>Sign In</button>
        </form>
        <div class="auth-divider">or</div>
        <div class="auth-social-group">
          <button type="button" class="auth-social-btn auth-social-google" id="googleLoginBtn" aria-label="Continue with Google">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" class="flex-shrink-0"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"></path><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.37 7.31 24 12 24z"></path><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.98 0 12s.46 3.83 1.26 5.42l4.02-3.15z"></path><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.63 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"></path></svg>
            <span>Continue with Google</span>
          </button>
          <button type="button" class="auth-social-btn auth-social-apple" id="appleLoginBtn" aria-label="Continue with Apple">
            <i class="fab fa-apple" style="font-size:1.25rem;"></i>
            <span>Continue with Apple</span>
          </button>
        </div>
        <div class="auth-register">New to KidNest? <a href="register.html">Create an account</a></div>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const form=document.getElementById('loginForm'),pw=document.getElementById('password'),toggle=document.getElementById('togglePassword'),alertBox=document.getElementById('loginAlert');
  toggle.addEventListener('click',()=>{const show=pw.type==='password';pw.type=show?'text':'password';toggle.innerHTML=show?'<i class="fas fa-eye-slash"></i>':'<i class="fas fa-eye"></i>'});
  document.getElementById('forgotPassword').addEventListener('click',e=>{e.preventDefault();alert('Password reset is a demo interaction. Connect this action to your backend later.')});
  form.addEventListener('submit',e=>{
    e.preventDefault();
    if(!form.checkValidity()||pw.value.length<6){form.classList.add('was-validated');alertBox.className='auth-alert';return}
    alertBox.textContent='Signed in successfully!';
    alertBox.className='auth-alert success show';
    const emailVal=document.getElementById('email').value;
    localStorage.setItem('kpz-user-email',emailVal);
    localStorage.setItem('kpz-parent-email',emailVal);
    localStorage.setItem('kpz-user-auth','true');
    localStorage.setItem('kpz-parent-auth','true');
  });
  const handleSocialLogin=(provider)=>{
    alertBox.textContent=`Signed in with ${provider} successfully!`;
    alertBox.className='auth-alert success show';
    const mockEmail=provider==='Google'?'user.google@kidnest.com':'user.apple@kidnest.com';
    localStorage.setItem('kpz-user-email',mockEmail);
    localStorage.setItem('kpz-parent-email',mockEmail);
    localStorage.setItem('kpz-user-auth','true');
    localStorage.setItem('kpz-parent-auth','true');
  };
  document.getElementById('googleLoginBtn')?.addEventListener('click',()=>handleSocialLogin('Google'));
  document.getElementById('appleLoginBtn')?.addEventListener('click',()=>handleSocialLogin('Apple'));
});
</script>
</body></html>
